<title>需要密码</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f6f8;color:#162639;
font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif}
.gate{width:min(390px,92vw);background:#fff;border:1px solid #dce4e9;border-radius:14px;
padding:30px 26px;box-shadow:0 20px 60px #14253819}
h1{margin:0 0 8px;font-size:19px}
p.sub{margin:0 0 20px;font-size:13px;color:#586777;line-height:1.65}
input{width:100%;padding:11px 13px;font:inherit;font-size:15px;border:1px solid #dce4e9;
border-radius:9px;background:#fbfcfd}
input:focus{outline:2px solid #08745b;outline-offset:1px;border-color:#08745b}
button{margin-top:12px;width:100%;padding:11px;font:inherit;font-size:15px;font-weight:700;
color:#fff;background:#08745b;border:0;border-radius:9px;cursor:pointer}
button:disabled{opacity:.55;cursor:progress}
#msg{margin:12px 0 0;font-size:13px;color:#9a5b12;min-height:1.4em}
</style>
</head>

</form>
